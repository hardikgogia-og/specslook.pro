<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;family=Outfit:wght@500;600&amp;display=swap');
      .specs-red { fill: #EA1D24; }
      .brand-black { fill: #000000; }
      .eye-green { fill: #00DF1D; }
      .eye-white { fill: #FFFFFF; }
      .tagline-font {
        font-family: 'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.22em;
      }
    </style>
  </defs>

  <!-- TOP SECTION: EYEBROWS & EYEGLASSES -->
  <g id="specslook-glasses-icon">
    <!-- Left Eyebrow (Arched up to right) -->
    <path d="M 290 82 C 330 64 395 56 455 74 C 410 65 340 70 290 82 Z" class="brand-black" />

    <!-- Right Eyebrow (Curved high inquisitive arch) -->
    <path d="M 540 68 C 585 36 650 20 695 48 C 660 38 600 48 540 68 Z" class="brand-black" />

    <!-- Eyeglasses Frame (Silhouette with bridge and temples) -->
    <!-- Outer Frame Path -->
    <path d="
      M 270 106
      L 300 106
      C 370 104 430 110 472 136
      C 488 142 512 142 528 136
      C 570 110 630 104 700 106
      L 730 106
      C 738 106 740 112 740 120
      C 740 134 734 140 724 142
      C 720 175 710 220 686 242
      C 660 264 610 266 560 256
      C 536 250 522 225 515 200
      C 510 180 490 180 485 200
      C 478 225 464 250 440 256
      C 390 266 340 264 314 242
      C 290 220 280 175 276 142
      C 266 140 260 134 260 120
      C 260 112 262 106 270 106 Z

      M 302 128
      C 296 170 306 218 328 234
      C 348 248 392 248 426 238
      C 446 232 458 206 462 170
      C 464 146 456 128 440 125
      C 396 120 342 120 302 128 Z

      M 538 170
      C 542 206 554 232 574 238
      C 608 248 652 248 672 234
      C 694 218 704 170 698 128
      C 658 120 604 120 560 125
      C 544 128 536 146 538 170 Z
    " fill-rule="evenodd" class="brand-black" />
  </g>

  <!-- MIDDLE SECTION: SPECSLOOK WORDMARK -->
  <g id="specslook-wordmark">
    <!-- "SPECS" in Bold Red -->
    <!-- S -->
    <path d="M 75 320 C 75 300 90 285 130 285 C 172 285 185 304 185 328 L 148 328 C 148 316 142 309 130 309 C 118 309 112 314 112 321 C 112 338 185 334 185 375 C 185 398 168 415 130 415 C 85 415 72 396 72 370 L 109 370 C 109 383 117 391 130 391 C 144 391 148 384 148 376 C 148 358 75 362 75 320 Z" class="specs-red" />

    <!-- P -->
    <path d="M 200 287 L 255 287 C 285 287 298 302 298 326 C 298 350 285 365 255 365 L 235 365 L 235 413 L 200 413 Z M 235 311 L 235 341 L 253 341 C 263 341 268 336 268 326 C 268 316 263 311 253 311 Z" class="specs-red" />

    <!-- E -->
    <path d="M 312 287 L 382 287 L 382 313 L 347 313 L 347 337 L 378 337 L 378 362 L 347 362 L 347 387 L 383 387 L 383 413 L 312 413 Z" class="specs-red" />

    <!-- C -->
    <path d="M 470 326 L 435 326 C 435 316 428 310 417 310 C 401 310 394 324 394 350 C 394 376 401 390 417 390 C 428 390 435 384 435 374 L 470 374 C 470 398 454 415 417 415 C 375 415 358 387 358 350 C 358 313 375 285 417 285 C 454 285 470 302 470 326 Z" class="specs-red" />

    <!-- S -->
    <path d="M 480 320 C 480 300 495 285 535 285 C 577 285 590 304 590 328 L 553 328 C 553 316 547 309 535 309 C 523 309 517 314 517 321 C 517 338 590 334 590 375 C 590 398 573 415 535 415 C 490 415 477 396 477 370 L 514 370 C 514 383 522 391 535 391 C 549 391 553 384 553 376 C 553 358 480 362 480 320 Z" class="specs-red" />

    <!-- L in Black -->
    <path d="M 605 287 L 640 287 L 640 387 L 686 387 L 686 413 L 605 413 Z" class="brand-black" />

    <!-- FIRST EYE "O" (Lime Green Outer Oval with White eyeball & Black Pupil) -->
    <g id="first-eye-o">
      <!-- Outer Green Oval -->
      <ellipse cx="715" cy="350" rx="34" ry="52" class="eye-green" />
      <!-- Inner White Eyeball -->
      <ellipse cx="715" cy="350" rx="23" ry="41" class="eye-white" />
      <!-- Black Pupil looking forward/right -->
      <circle cx="722" cy="368" r="14" class="brand-black" />
      <!-- Subtle white eye glint -->
      <circle cx="725" cy="364" r="3" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- SECOND EYE "O" (Lime Green Outer Oval with White eyeball & Black Pupil) -->
    <g id="second-eye-o">
      <!-- Outer Green Oval -->
      <ellipse cx="795" cy="350" rx="34" ry="52" class="eye-green" />
      <!-- Inner White Eyeball -->
      <ellipse cx="795" cy="350" rx="23" ry="41" class="eye-white" />
      <!-- Black Pupil looking forward/right -->
      <circle cx="802" cy="368" r="14" class="brand-black" />
      <!-- Subtle white eye glint -->
      <circle cx="805" cy="364" r="3" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- K in Black -->
    <path d="M 855 287 L 890 287 L 890 338 L 933 287 L 977 287 L 920 348 L 980 413 L 935 413 L 890 361 L 890 413 L 855 413 Z" class="brand-black" />
  </g>

  <!-- BOTTOM SECTION: TAGLINE -->
  <text x="320" y="460" class="brand-black tagline-font">A Complete Eye wear Zone</text>
</svg>
